<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Windows 9x Explorer — Embedded</title>
  <style>
    :root{--bg:#2b2b2b;--panel:#2b2b2b;--face:#2b2b2b;--text:#33ff00;--accent:#ccced1}
    *{box-sizing:border-box;font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif}
    body{margin:0;background:var(--face);color:var(--text)}

    .content{display:flex;height:100vh;width:100vw}
    .left{width:260px;padding:12px;background:linear-gradient(#333333,#333333);border-right:2px solid rgba(0,0,0,.08);overflow:auto}
    .right{flex:1;padding:12px;background:var(--panel);display:flex;flex-direction:column}

    .folder{padding:6px;border:2px solid transparent;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer}
    .folder:hover{background:#333333}
    .folder.active{background:linear-gradient(#333333,#333333);border:2px inset #fff}

    .filegrid{flex:1;display:flex;flex-direction:column}
    .files-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;align-content:start;padding:8px;overflow:auto}
    .file{background:linear-gradient(#333333,#333333);padding:8px;border:2px solid #fff;text-align:center;cursor:default;user-select:none}
    .file .icon{font-size:32px}
    .file .name{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .statusbar{height:26px;padding:6px 10px;background:linear-gradient(#333333,#333333);border-top:2px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between}

    .modal{position:fixed;inset:0;background:rgba(55,55,55,.35);display:flex;align-items:center;justify-content:center}
    .dialog{width:760px;background:var(--face);border:2px solid #8c8c8c;box-shadow:0 6px 24px rgba(0,0,0,.35)}
    .dialog .head{display:flex;align-items:center;justify-content:space-between;padding:8px;background:linear-gradient(#666666,#ccced1);color:#fff}
    .dialog .body{padding:12px}
    .dialog pre{width:100%;height:420px;padding:8px;border:2px inset #fff;background:#666666;overflow:auto;white-space:pre-wrap}
    .dialog iframe{width:100%;height:420px;border:2px inset #fff;background:#fff}
    .dialog .actions{padding:8px;display:flex;gap:8px;justify-content:flex-end}

    .btn{padding:6px 10px;border:2px solid #fff;background:linear-gradient(#black,#black);cursor:pointer}
    .muted{color:#ccced1}
  </style>
</head>
<body>
  <div class="content">
    <div class="left" id="folders"></div>
    <div class="right">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="muted" id="path">Documents</div>
        <div class="muted" id="count">0 items</div>
      </div>
      <div class="filegrid">
        <div class="files-list" id="filesList"></div>
      </div>
      <div class="statusbar">
        <div id="status">Ready</div>
        <div id="storage">Static</div>
      </div>
    </div>
  </div>

  <div id="modal" style="display:none" class="modal" role="dialog" aria-hidden="true">
    <div class="dialog">
      <div class="head">
        <div id="docTitle">Document</div>
        <div><button class="btn" id="closeModal">Close</button></div>
      </div>
      <div class="body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const state = {
      folders: ['Torchwood files','NETWORK/ARBEIT COM'],
      cwd: 'Torchwood files',
      files: {
        'Torchwood files': [
          {id:'1',name:'Readme.txt',content:'Welcome to Project torchwood.\nthis is a archive of every log pertaining to the [CLASSIFIED]\nFiles are static and hardcoded.'},
	  {id:'2',name:'memories.txt',content:'Some scientists have noticed that ceritan objects have vauge sences of memories depending on how intertwines they were with their owners.'},
          {id:'3',name:'Notes.txt',content:'[1.0] the [CLASSIFIED] closed recently, we managed to reopen it however, so not much of a loss.\n[2.0] the [CLASSIFIED] has been acting up recently, shooting random things out.'},
          {id:'4',name:'Soul.txt',content:'new studies show that if someone dies while holding an object, their soul can rub off on it. this is notible as when said object are inserted into the [CLASSIFIED} they can inherit the persons soul. however, this has only been oberved happening once.'},
	  {id:'5',name:'sentience.txt',content:'Inserting a object into the [CLASSIFIED] results in a bigger version coming out. these versions seem like normal people as they can move and talk, but they appear to be made of the materials they started out as instead of flesh and blood. until further notice, any objects that go through this conversion will be reused as employees.'},
          {id:'6',name:'NOTICE_OF_MOVMENT.txt',content:'INFORMATION: this folder is in the process of being murged with its precursor at this time.\n expect many missing files'},
          
          
        ],
        'NETWORK/ARBEIT COM': [
		  {id:'1',name:'DEPRECATED.txt',content:'this drive is NOT TO BE USED as it is being removed. please store all further files under Torchwood.'},
		]
      }
    };

    const foldersEl = document.getElementById('folders');
    const filesList = document.getElementById('filesList');
    const pathEl = document.getElementById('path');
    const countEl = document.getElementById('count');
    const modal = document.getElementById('modal');
    const modalBody = document.getElementById('modalBody');
    const docTitle = document.getElementById('docTitle');

    function renderFolders(){
      foldersEl.innerHTML='';
      state.folders.forEach(f=>{
        const el=document.createElement('div');
        el.className='folder'+(state.cwd===f?' active':'');
        el.textContent=f;
        el.onclick=()=>{state.cwd=f;render();};
        foldersEl.appendChild(el);
      });
    }

    function renderFiles(){
      filesList.innerHTML='';
      const arr=state.files[state.cwd]||[];
      arr.forEach(file=>{
        const el=document.createElement('div');el.className='file';el.title=file.name;
        el.ondblclick=()=>openViewer(file);
        el.innerHTML=`<div class="icon">📄</div><div class="name">${escapeHtml(file.name)}</div>`;
        filesList.appendChild(el);
      });
      countEl.textContent=arr.length+' items';
    }

    function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

    function openViewer(file){
      docTitle.textContent=file.name;
      modalBody.innerHTML=`<pre>${escapeHtml(file.content)}</pre>`;
      modal.style.display='flex';
      modal.setAttribute('aria-hidden','false');
    }
    function closeViewer(){
      modal.style.display='none';
      modal.setAttribute('aria-hidden','true');
    }

    document.getElementById('closeModal').onclick=()=>closeViewer();

    function render(){
      renderFolders();
      renderFiles();
      pathEl.textContent=state.cwd;
    }

    render();
  </script>
</body>
</html>
