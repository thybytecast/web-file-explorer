<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Windows 9x Explorer — Embedded</title>
  <style>
    :root{--bg:#c0c0c0;--panel:#e0e0e0;--face:#d4d0c8;--text:#000;--accent:#0a64ad}
    *{box-sizing:border-box;font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif}
    body{margin:0;background:var(--face);color:var(--text)}

    .content{display:flex;height:100vh;width:100vw}
    .left{width:260px;padding:12px;background:linear-gradient(#eee,#ddd);border-right:2px solid rgba(0,0,0,.08);overflow:auto}
    .right{flex:1;padding:12px;background:var(--panel);display:flex;flex-direction:column}

    .folder{padding:6px;border:2px solid transparent;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer}
    .folder:hover{background:#fff}
    .folder.active{background:linear-gradient(#dcdcdc,#cfcfcf);border:2px inset #fff}

    .filegrid{flex:1;display:flex;flex-direction:column}
    .files-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;align-content:start;padding:8px;overflow:auto}
    .file{background:linear-gradient(#fff,#efefef);padding:8px;border:2px solid #fff;text-align:center;cursor:default;user-select:none}
    .file .icon{font-size:32px}
    .file .name{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .statusbar{height:26px;padding:6px 10px;background:linear-gradient(#dcdcdc,#cfcfcf);border-top:2px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
    .dialog{width:760px;background:var(--face);border:2px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.35)}
    .dialog .head{display:flex;align-items:center;justify-content:space-between;padding:8px;background:linear-gradient(#0a64ad,#073a6b);color:#fff}
    .dialog .body{padding:12px}
    .dialog pre{width:100%;height:420px;padding:8px;border:2px inset #fff;background:#fff;overflow:auto;white-space:pre-wrap}
    .dialog iframe{width:100%;height:420px;border:2px inset #fff;background:#fff}
    .dialog .actions{padding:8px;display:flex;gap:8px;justify-content:flex-end}

    .btn{padding:6px 10px;border:2px solid #fff;background:linear-gradient(#f6f6f6,#dedede);cursor:pointer}
    .muted{color:#333}
  </style>
</head>
<body>
  <div class="content">
    <div class="left" id="folders"></div>
    <div class="right">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="muted" id="path">Documents</div>
        <div class="muted" id="count">0 items</div>
      </div>
      <div class="filegrid">
        <div class="files-list" id="filesList"></div>
      </div>
      <div class="statusbar">
        <div id="status">Ready</div>
        <div id="storage">Static</div>
      </div>
    </div>
  </div>

  <div id="modal" style="display:none" class="modal" role="dialog" aria-hidden="true">
    <div class="dialog">
      <div class="head">
        <div id="docTitle">Document</div>
        <div><button class="btn" id="closeModal">Close</button></div>
      </div>
      <div class="body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const state = {
      folders: ['Desktop','Documents','My Computer'],
      cwd: 'Documents',
      files: {
        'Documents': [
          {id:'1',name:'Readme.txt',content:'Welcome to the Windows 9x Explorer demo.\nFiles are static and hardcoded.'},
          {id:'2',name:'Notes.txt',content:'Only the host can modify what appears here.'}
        ],
        'Desktop': [
          {id:'3',name:'Shortcut.txt',content:'This is just a placeholder file on the Desktop.'}
        ],
        'My Computer': []
      }
    };

    const foldersEl = document.getElementById('folders');
    const filesList = document.getElementById('filesList');
    const pathEl = document.getElementById('path');
    const countEl = document.getElementById('count');
    const modal = document.getElementById('modal');
    const modalBody = document.getElementById('modalBody');
    const docTitle = document.getElementById('docTitle');

    function renderFolders(){
      foldersEl.innerHTML='';
      state.folders.forEach(f=>{
        const el=document.createElement('div');
        el.className='folder'+(state.cwd===f?' active':'');
        el.textContent=f;
        el.onclick=()=>{state.cwd=f;render();};
        foldersEl.appendChild(el);
      });
    }

    function renderFiles(){
      filesList.innerHTML='';
      const arr=state.files[state.cwd]||[];
      arr.forEach(file=>{
        const el=document.createElement('div');el.className='file';el.title=file.name;
        el.ondblclick=()=>openViewer(file);
        el.innerHTML=`<div class="icon">📄</div><div class="name">${escapeHtml(file.name)}</div>`;
        filesList.appendChild(el);
      });
      countEl.textContent=arr.length+' items';
    }

    function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

    function openViewer(file){
      docTitle.textContent=file.name;
      modalBody.innerHTML=`<pre>${escapeHtml(file.content)}</pre>`;
      modal.style.display='flex';
      modal.setAttribute('aria-hidden','false');
    }
    function closeViewer(){
      modal.style.display='none';
      modal.setAttribute('aria-hidden','true');
    }

    document.getElementById('closeModal').onclick=()=>closeViewer();

    function render(){
      renderFolders();
      renderFiles();
      pathEl.textContent=state.cwd;
    }

    render();
  </script>
</body>
</html>
